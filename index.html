<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURA — 概念设计</title>
<meta name="description" content="AURA 未来 AI 手机概念设计：产品页与 AI 能力页。">
<style>
  :root {
    --bg: #000;
    --fg: #f5f5f7;
    --muted: #8b8b93;
    --muted-2: #5e5e67;
    --line: rgba(255, 255, 255, 0.09);
    --cyan: #4fd8e8;
    --violet: #a78bfa;
    --pad: clamp(20px, 6vw, 90px);
    --ease: cubic-bezier(0.22, 0.7, 0.2, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    background: #000;
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(28px, 6vw, 70px) var(--pad);
  }

  .shell { width: 100%; max-width: 1080px; }

  .kicker {
    margin: 0 0 12px;
    font-size: 12px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--muted-2);
  }

  h1 {
    margin: 0;
    font-size: clamp(40px, 7vw, 82px);
    font-weight: 600;
    letter-spacing: 0.14em;
    line-height: 1;
  }

  .sub {
    margin: 22px 0 0;
    font-size: clamp(15px, 1.6vw, 19px);
    color: var(--muted);
    max-width: 46ch;
    line-height: 1.6;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(16px, 2.4vw, 28px);
    margin-top: clamp(38px, 6vw, 64px);
  }

  .card {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: clamp(16px, 2vw, 24px);
    overflow: hidden;
    background: #050507;
    color: inherit;
    text-decoration: none;
    transition: border-color 0.45s var(--ease), transform 0.45s var(--ease),
      background 0.45s var(--ease);
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(255, 255, 255, 0.22);
    background: #0a0a0e;
  }

  .thumb {
    height: clamp(150px, 20vw, 210px);
    overflow: hidden;
    background: #000;
    position: relative;
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 46%;
    mix-blend-mode: screen;
    transition: transform 0.7s var(--ease);
  }

  .card:hover .thumb img { transform: scale(1.045); }

  .thumb::after {
    content: "";
    position: absolute;
    inset: auto 0 0 0;
    height: 55%;
    background: linear-gradient(180deg, transparent, #050507);
    pointer-events: none;
  }

  .body { padding: clamp(20px, 2.4vw, 30px); }

  .tag {
    margin: 0 0 10px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cyan);
  }

  .card h2 {
    margin: 0 0 12px;
    font-size: clamp(20px, 2.2vw, 26px);
    font-weight: 600;
    letter-spacing: -0.022em;
  }

  .card p {
    margin: 0;
    font-size: 14.5px;
    color: var(--muted);
    line-height: 1.62;
  }

  .go {
    display: inline-block;
    margin-top: 20px;
    font-size: 15px;
    color: #f5f5f7;
  }

  .go i {
    font-style: normal;
    display: inline-block;
    transition: transform 0.35s var(--ease);
  }

  .card:hover .go i { transform: translateX(4px); }

  footer {
    margin-top: clamp(34px, 5vw, 54px);
    padding-top: 22px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    line-height: 1.8;
    color: var(--muted-2);
  }

  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
    .thumb { height: 180px; }
  }
</style>
</head>
<body>
  <div class="shell">
    <p class="kicker">Concept Design · 2026</p>
    <h1>AURA</h1>
    <p class="sub">两个页面，同一套设计语言：一个讲硬件产品，一个讲 AI 能力。</p>

    <div class="grid">
      <a class="card" href="aura-phone/">
        <div class="thumb"><img src="aura-phone/assets/img-hero.webp" alt="AURA One 机身"></div>
        <div class="body">
          <p class="tag">产品页</p>
          <h2>AURA One</h2>
          <p>钛金属中框、AURA N1 神经引擎、全息感知三摄。完整规格、设计与配色。</p>
          <span class="go">查看产品页 <i>›</i></span>
        </div>
      </a>

      <a class="card" href="aura-intelligence/">
        <div class="thumb"><img src="aura-intelligence/assets/ai-core.webp" alt="AURA Intelligence 智能核心"></div>
        <div class="body">
          <p class="tag">能力页</p>
          <h2>AURA Intelligence</h2>
          <p>实时同传、情境预判、端侧隐私。所有理解都在设备上完成，不上传原始数据。</p>
          <span class="go">查看能力页 <i>›</i></span>
        </div>
      </a>
    </div>

    <footer>
      © 2026 AURA Technology. 概念设计稿，非真实产品页面；站内所有文案、规格、价格与图像均为示意内容。
    </footer>
  </div>
</body>
</html>
